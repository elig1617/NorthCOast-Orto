[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "po-ingest"
version = "0.1.0"
description = "Ingest VA purchase-order PDFs and create confirmed SmartSuite orders"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "North Coast Orthopedics" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "PyYAML>=6.0",
    "rapidfuzz>=3.6",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpserver>=1.1",
    "respx>=0.21",
]

[project.scripts]
po-ingest = "po_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
